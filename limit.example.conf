# bcn-stratum block limiter settings. Re-read every minute, no restart needed.
#
# These are the values currently used by the project's own X3:
# auto mode aims at 46% of the network, capped at 41% of the blocks it finds.
#
# Fixed mode: set target_share = 0, then only submit_ratio applies.
#
# Network share of your miner -> average block time for everyone else if it stops,
# until difficulty adjusts:
#   33% -> about 3 min
#   40% -> about 3.3 min
#   50% -> about 4 min
#   67% -> about 6 min
#   80% -> about 10 min

target_share = 0.46     # 0 < s < 1 turns on auto mode
submit_ratio = 0.41     # share of found blocks submitted; also the start value after a restart
min_ratio    = 0.01     # auto mode lower bound
max_ratio    = 0.41     # auto mode upper bound
adjust_hours = 6        # auto mode changes the ratio at most this often, by at most x1.25
